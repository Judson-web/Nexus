name: TypeScript CI

on:
  push:
    branches:
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run train -- --epochs 2 --output /tmp/nexus-smoke.json
      - run: npm run generate -- --checkpoint /tmp/nexus-smoke.json --prompt "Nexus" --tokens 12
      - run: npm run train:context -- --epochs 2 --output /tmp/nexus-context-smoke.json
      - run: npm run generate:context -- --checkpoint /tmp/nexus-context-smoke.json --prompt "Nexus" --tokens 12
      - run: npm run train:transformer -- --epochs 1 --context-size 3 --embedding-size 4 --heads 2 --feed-forward-size 8 --learning-rate 0.0001 --output /tmp/nexus-transformer-smoke.json
      - run: npm run generate:transformer -- --checkpoint /tmp/nexus-transformer-smoke.json --prompt "Nexus" --tokens 4
      - run: npm run evaluate -- --epochs 2
      - name: Verify held-out Transformer evaluation
        run: npm run evaluate:transformer -- --epochs 1 --context-size 3 --embedding-size 4 --heads 2 --feed-forward-size 8 --learning-rate 0.0001
      - name: Verify Transformer training profiler
        run: npm run profile:transformer -- --epochs 1 --context-size 2 --embedding-size 4 --heads 2 --feed-forward-size 4 --learning-rate 0.0001
      - name: Verify manifest-driven evaluation
        run: |
          mkdir -p /tmp/nexus-data
          for i in $(seq 1 120); do echo "Nexus dataset sample $i supports repeatable training and evaluation."; done > /tmp/nexus-data/corpus.txt
          npm run prepare:dataset -- --input /tmp/nexus-data/corpus.txt --output /tmp/nexus-data/manifest.json --seed 17
          npm run evaluate:manifest -- --manifest /tmp/nexus-data/manifest.json --epochs 1 --seed 17
          npm run train:transformer:manifest -- --manifest /tmp/nexus-data/manifest.json --output /tmp/nexus-data/transformer.json --epochs 1 --context-size 2 --embedding-size 4 --heads 2 --feed-forward-size 4 --learning-rate 0.0001
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('/tmp/nexus-data/transformer.json.provenance.json','utf8')); if(p.dataset.validationAndTestUsedForTraining!==false || !p.checkpoint.sha256 || p.training.trainedExamples!==p.dataset.splitCounts.train || p.heldOutEvaluation.testUsedForModelSelection!==false || !Number.isFinite(p.heldOutEvaluation.validation.negativeLogLikelihood) || !Number.isFinite(p.heldOutEvaluation.test.perplexity)) process.exit(1)"
      - name: Verify source-provided split preparation and leakage guard
        run: |
          mkdir -p /tmp/nexus-source-splits
          printf 'training example one\ntraining example two\n' > /tmp/nexus-source-splits/train.txt
          printf 'validation example one\n' > /tmp/nexus-source-splits/validation.txt
          printf 'test example one\n' > /tmp/nexus-source-splits/test.txt
          npm run prepare:dataset:source-splits -- --train /tmp/nexus-source-splits/train.txt --validation /tmp/nexus-source-splits/validation.txt --test /tmp/nexus-source-splits/test.txt --source-name "CI fixture" --source-url "https://example.invalid/dataset" --license "test-only" --attribution "CI fixture" --output /tmp/nexus-source-splits/manifest.json
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('/tmp/nexus-source-splits/manifest.json','utf8')); if(m.splits.train!==2 || m.splits.validation!==1 || m.splits.test!==1 || m.sourceMetadata.splitPolicy!=='preserved-source-provided-splits' || m.sourceMetadata.license!=='test-only') process.exit(1)"
          printf 'training example one\n' > /tmp/nexus-source-splits/validation-leak.txt
          if npm run prepare:dataset:source-splits -- --train /tmp/nexus-source-splits/train.txt --validation /tmp/nexus-source-splits/validation-leak.txt --test /tmp/nexus-source-splits/test.txt --source-name "CI fixture" --source-url "https://example.invalid/dataset" --license "test-only" --attribution "CI fixture" --output /tmp/nexus-source-splits/should-not-exist.json; then
            echo "Cross-split duplicate should have been rejected" >&2
            exit 1
          fi
      - run: npm run build
