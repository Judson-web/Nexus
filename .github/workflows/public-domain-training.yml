name: Nexus English curriculum training experiments

on:
  # Expensive matrix runs start only when the training workflow itself changes.
  # Normal code commits are covered by TypeScript CI and do not restart hours-long experiments.
  push:
    branches:
      - "feat/english-curriculum-context"
    paths:
      - ".github/workflows/public-domain-training.yml"
  workflow_dispatch:
    inputs:
      paragraphs_per_book:
        description: "Deterministically sampled paragraphs per book (20-1000)"
        required: true
        default: "120"
        type: string
      epochs:
        description: "Training epochs per sequence"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

# New commits supersede stale, queued matrix runs; each retained run still fans out into four candidates.
concurrency:
  group: nexus-english-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Acquire actual public-domain full text
        run: npm run acquire:public-domain -- --paragraphs-per-book "${{ inputs.paragraphs_per_book || '120' }}" --output artifacts/public-domain-books
      - name: Build source-preserving train, validation, and test manifest
        run: npm run prepare:dataset:source-splits -- --train artifacts/public-domain-books/train.txt --validation artifacts/public-domain-books/validation.txt --test artifacts/public-domain-books/test.txt --source-name "Project Gutenberg public-domain books" --source-url "https://www.gutenberg.org/" --license "Curated US public-domain works; see per-work metadata in acquisition manifest" --attribution "Project Gutenberg ebook IDs, titles, authors, and text hashes in acquisition manifest" --output artifacts/public-domain-manifest.json
      - name: Audit corpus and tokenizer coverage
        run: npx tsx src/cli/audit-tokenizer.ts --manifest artifacts/public-domain-manifest.json > artifacts/tokenizer-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-english-corpus-${{ github.run_id }}
          path: |
            artifacts/public-domain-books/
            artifacts/public-domain-manifest.json
            artifacts/tokenizer-audit.json
          if-no-files-found: error
          retention-days: 1

  train-experiments:
    needs: prepare-corpus
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: context32-scalar-baseline
            context_size: 32
            embedding_size: 16
            heads: 4
            feed_forward_size: 64
            learning_rate: "0.0003"
            target_stride: 2
            gradient_backend: scalar
          - name: context32-tape-baseline
            context_size: 32
            embedding_size: 16
            heads: 4
            feed_forward_size: 64
            learning_rate: "0.0003"
            target_stride: 2
            gradient_backend: tape
          - name: context64-tape-baseline
            context_size: 64
            embedding_size: 16
            heads: 4
            feed_forward_size: 64
            learning_rate: "0.0003"
            target_stride: 2
            gradient_backend: tape
          - name: context64-tape-low-lr
            context_size: 64
            embedding_size: 16
            heads: 4
            feed_forward_size: 64
            learning_rate: "0.0001"
            target_stride: 2
            gradient_backend: tape
          - name: context64-tape-wide
            context_size: 64
            embedding_size: 24
            heads: 4
            feed_forward_size: 96
            learning_rate: "0.0003"
            target_stride: 2
            gradient_backend: tape
          - name: context64-scalar-baseline
            context_size: 64
            embedding_size: 16
            heads: 4
            feed_forward_size: 64
            learning_rate: "0.0003"
            target_stride: 2
            gradient_backend: scalar
    name: Train ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: nexus-english-corpus-${{ github.run_id }}
          path: artifacts
      - name: Train independent candidate
        run: >-
          npm run train:transformer:manifest --
          --manifest artifacts/public-domain-manifest.json
          --output artifacts/nexus-${{ matrix.name }}.json
          --epochs "${{ inputs.epochs || '1' }}"
          --seed 17
          --optimizer adam
          --gradient-backend ${{ matrix.gradient_backend }}
          --context-size ${{ matrix.context_size }}
          --embedding-size ${{ matrix.embedding_size }}
          --heads ${{ matrix.heads }}
          --feed-forward-size ${{ matrix.feed_forward_size }}
          --learning-rate ${{ matrix.learning_rate }}
          --max-minutes 300
          --max-tokens-per-example 512
          --target-stride ${{ matrix.target_stride }}
      - name: Verify provenance and held-out metrics
        env:
          CANDIDATE: artifacts/nexus-${{ matrix.name }}.json
          EXPECTED_CONTEXT: ${{ matrix.context_size }}
          EXPECTED_EMBEDDING: ${{ matrix.embedding_size }}
          EXPECTED_STRIDE: ${{ matrix.target_stride }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const path = process.env.CANDIDATE;
            const checkpoint = readFileSync(path);
            const digest = createHash("sha256").update(checkpoint).digest("hex");
            const provenance = JSON.parse(readFileSync(path + ".provenance.json", "utf8"));
            const manifest = JSON.parse(readFileSync("artifacts/public-domain-manifest.json", "utf8"));
            if (provenance.checkpoint.sha256 !== digest) throw new Error("Checkpoint SHA-256 mismatch");
            if (provenance.dataset.validationAndTestUsedForTraining !== false) throw new Error("Held-out data leakage flag invalid");
            if (provenance.training.trainedExamples !== manifest.splits.train) throw new Error("Actual trained example count differs from train split");
            if (provenance.training.targetStride !== Number(process.env.EXPECTED_STRIDE) || provenance.training.maxTokensPerExample !== 512) throw new Error("Training token coverage configuration mismatch");
            if (provenance.model.embeddingSize !== Number(process.env.EXPECTED_EMBEDDING) || provenance.model.contextSize !== Number(process.env.EXPECTED_CONTEXT)) throw new Error("Model scale configuration mismatch");
            for (const split of ["validation", "test"]) {
              const score = provenance.heldOutEvaluation[split];
              if (!Number.isFinite(score.negativeLogLikelihood) || !Number.isFinite(score.perplexity) || score.tokens < 1) throw new Error("Invalid held-out score: " + split);
            }
            writeFileSync("artifacts/training-summary.json", JSON.stringify({
              experiment: process.env.CANDIDATE,
              dataset: manifest.dataset,
              trainSplit: manifest.splits.train,
              validationSplit: manifest.splits.validation,
              testSplit: manifest.splits.test,
              training: provenance.training,
              model: provenance.model,
              heldOutEvaluation: provenance.heldOutEvaluation,
              checkpointSha256: digest,
              generatedTextRequiredForPromotion: true
            }, null, 2) + "\n");
            console.log(readFileSync("artifacts/training-summary.json", "utf8"));
          '
      - name: Generate samples for human-readable quality review
        run: |
          mkdir -p artifacts/generation-samples
          npx tsx src/cli/transformer.ts generate --checkpoint artifacts/nexus-${{ matrix.name }}.json --prompt "It was a dark and stormy night" --tokens 160 > artifacts/generation-samples/story.txt
          npx tsx src/cli/transformer.ts generate --checkpoint artifacts/nexus-${{ matrix.name }}.json --prompt "The natural world" --tokens 160 > artifacts/generation-samples/nature.txt
          npx tsx src/cli/transformer.ts generate --checkpoint artifacts/nexus-${{ matrix.name }}.json --prompt "The meaning of knowledge" --tokens 160 > artifacts/generation-samples/knowledge.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-training-${{ matrix.name }}-${{ github.run_id }}
          path: |
            artifacts/nexus-${{ matrix.name }}.json
            artifacts/nexus-${{ matrix.name }}.json.sha256
            artifacts/nexus-${{ matrix.name }}.json.provenance.json
            artifacts/training-summary.json
            artifacts/tokenizer-audit.json
            artifacts/generation-samples/
          if-no-files-found: error
          retention-days: 30
