name: Nexus bounded corpus training

on:
  push:
    branches:
      - "training/**"
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs per example (start small)"
        required: true
        default: "1"
        type: string
      seed:
        description: "Deterministic model seed"
        required: true
        default: "17"
        type: string

concurrency:
  group: nexus-corpus-training
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acquire-train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Acquire pinned, license-verified OASST1 conversations
        run: npm run acquire:oasst1 -- --max-trees 500 --output artifacts/oasst1
      - name: Build conversation training manifest with isolated splits
        run: npm run prepare:dataset:source-splits -- --train artifacts/oasst1/train.txt --validation artifacts/oasst1/validation.txt --test artifacts/oasst1/test.txt --source-name "OpenAssistant Conversations Dataset (OASST1)" --source-url "https://huggingface.co/datasets/OpenAssistant/oasst1/tree/fdf72ae0827c1cda404aff25b6603abec9e3399b" --license "Apache-2.0" --attribution "OpenAssistant contributors, OASST1, Apache-2.0; see LICENSE and acquisition manifest" --output artifacts/dataset-manifest.json
      - name: Audit tokenizer coverage and sequence lengths
        run: npx tsx src/cli/audit-tokenizer.ts --manifest artifacts/dataset-manifest.json > artifacts/tokenizer-audit.json
      - name: Run concurrent, validation-ranked model sweep
        run: npm run train:sweep -- --manifest artifacts/dataset-manifest.json --output-dir artifacts/sweep --summary artifacts/sweep-summary.json --workers 1 --epochs "${{ inputs.epochs || '1' }}" --seed "${{ inputs.seed || '17' }}" --max-minutes 15 --max-tokens-per-example 96 --target-stride 16
      - name: Verify all candidate checkpoints and select by validation only
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const manifest = JSON.parse(readFileSync("artifacts/dataset-manifest.json", "utf8"));
            const sweep = JSON.parse(readFileSync("artifacts/sweep-summary.json", "utf8"));
            if (sweep.testUsedForSelection !== false || !sweep.winner || sweep.runs.length !== 4) throw new Error("Sweep summary missing candidates or selection guard");
            const experiments = sweep.runs.map((run) => {
              if (run.exitCode !== 0 || !Number.isFinite(run.validationNll)) throw new Error("Candidate failed: " + run.candidate.name + ": " + run.error);
              const provenance = JSON.parse(readFileSync(run.output + ".provenance.json", "utf8"));
              const digest = createHash("sha256").update(readFileSync(run.output)).digest("hex");
              if (provenance.checkpoint.sha256 !== digest) throw new Error("Checkpoint SHA-256 mismatch: " + run.candidate.name);
              if (provenance.dataset.validationAndTestUsedForTraining !== false) throw new Error("Held-out leakage flag invalid");
              if (provenance.training.trainedExamples !== manifest.splits.train) throw new Error("Training example count mismatch");
              if (provenance.heldOutEvaluation.testUsedForModelSelection !== false) throw new Error("Test data used for selection");
              for (const split of ["validation", "test"]) {
                const score = provenance.heldOutEvaluation[split];
                if (!Number.isFinite(score.negativeLogLikelihood) || !Number.isFinite(score.perplexity) || score.tokens < 1) throw new Error("Invalid held-out score: " + split);
              }
              return { name: run.candidate.name, output: run.output, learningRate: run.candidate.learningRate, optimizer: run.candidate.optimizer, seed: run.candidate.seed, validationNll: run.validationNll, trainingLoss: provenance.training.meanFinalTrainingLoss, validation: provenance.heldOutEvaluation.validation, test: provenance.heldOutEvaluation.test, checkpointSha256: digest };
            });
            experiments.sort((a, b) => a.validationNll - b.validationNll);
            if (experiments[0].name !== sweep.winner.name) throw new Error("Sweep winner does not match validation ranking");
            writeFileSync("artifacts/experiment-results.json", JSON.stringify({ selectionMetric: "validation negative log-likelihood (test set not used for selection)", experiments }, null, 2) + "\n");
            console.log(JSON.stringify({ acceptedExamples: manifest.acceptedExamples, splits: manifest.splits, selectionMetric: "validation negative log-likelihood", winner: experiments[0].name, experiments: experiments.map(({name, validationNll, test}) => ({name, validationNll, testPerplexity: test.perplexity})) }, null, 2));
          '
      - name: Generate samples from validation-selected checkpoint
        run: |
          set -euo pipefail
          checkpoint=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const r = JSON.parse(readFileSync("artifacts/experiment-results.json", "utf8")); const path = r.experiments[0]?.output; if (typeof path !== "string") throw new Error("No validation-ranked checkpoint"); process.stdout.write(path);')
          test -s "$checkpoint"
          mkdir -p artifacts/generation-samples
          npx tsx src/cli/transformer.ts generate --checkpoint "$checkpoint" --prompt "User: Explain what a black hole is in simple terms. Assistant: " --tokens 120 > artifacts/generation-samples/universe.txt
          npx tsx src/cli/transformer.ts generate --checkpoint "$checkpoint" --prompt "User: Write a short introduction to scientific research. Assistant: " --tokens 120 > artifacts/generation-samples/research.txt
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const prompts = ["User: Explain what a black hole is in simple terms. Assistant: ", "User: Write a short introduction to scientific research. Assistant: "];
            const files = ["artifacts/generation-samples/universe.txt", "artifacts/generation-samples/research.txt"];
            const samples = files.map((path, index) => {
              const text = readFileSync(path, "utf8");
              const prompt = prompts[index];
              if (!text.startsWith(prompt)) throw new Error("Generated sample lost its prompt: " + path);
              const continuation = text.slice(prompt.length).trim();
              const checks = {
                promptPreserved: text.startsWith(prompt),
                continuationLongEnough: continuation.length >= 20,
                containsReadableLatin: /[A-Za-z]/.test(continuation),
                notSingleCharacterCollapse: continuation.length > 0 && new Set(continuation).size > 1,
              };
              return { prompt, continuationCharacters: continuation.length, checks, status: Object.values(checks).every(Boolean) ? "passed" : "warning", sample: text };
            });
            const qualityWarnings = samples.filter((sample) => sample.status !== "passed").map(({ prompt, checks }) => ({ prompt, checks }));
            writeFileSync("artifacts/generation-samples/summary.json", JSON.stringify({ selectedBy: "validation negative log-likelihood", qualityNote: "Generation sanity checks are diagnostic. A short or empty continuation is preserved and flagged so the run can upload metrics and samples; this is not evidence of useful generation.", qualityWarnings, samples }, null, 2) + "\n");
            console.log(JSON.stringify({ samples: samples.map(({ prompt, continuationCharacters, status, checks }) => ({ prompt, continuationCharacters, status, checks })), qualityWarnings }, null, 2));
          '
      - name: Upload training diagnostics and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-oasst1-transformer-${{ github.run_id }}
          path: |
            artifacts/oasst1/
            artifacts/dataset-manifest.json
            artifacts/sweep/
            artifacts/sweep-summary.json
            artifacts/tokenizer-audit.json
            artifacts/experiment-results.json
            artifacts/generation-samples/
          if-no-files-found: warn
          retention-days: 14
